<div class="task-card">
  <div class="task-card__header">
    <h3>{{ task.nome }}</h3>
    <span class="badge status">{{ task.status }}</span>
  </div>

  <p class="task-card__descricao">{{ task.descricao }}</p>

  <div class="task-card__footer">
    <span class="badge prioridade">{{ task.prioridade }}</span>
    <span class="valor">R$ {{ task.valor }}</span>
  </div>
</div>
